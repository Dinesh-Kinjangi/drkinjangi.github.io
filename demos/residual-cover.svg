  <ellipse cx="280" cy="200" rx="60" ry="60" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M360 200 Q520 120 720 200 Q520 280 360 200" fill="none" stroke="url(#flow)" stroke-width="3"/>
  <path d="M360 190 Q500 130 700 190" fill="none" stroke="#7dd3fc" stroke-width="1.5" opacity="0.6"/>
  <path d="M360 210 Q500 270 700 210" fill="none" stroke="#7dd3fc" stroke-width="1.5" opacity="0.6"/>
  <text x="400" y="340" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="28" font-weight="600">Residual</text>
  <text x="400" y="370" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="14">Open a case. Check the mesh. Watch it converge.</text>
