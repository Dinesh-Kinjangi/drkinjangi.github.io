<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="Residual">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
    <linearGradient id="flow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:0.2"/>
      <stop offset="50%" style="stop-color:#38bdf8;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:0.2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <g stroke="#334155" stroke-width="1" opacity="0.5">
    <path d="M0 80 H800 M0 160 H800 M0 240 H800 M0 320 H800"/>
    <path d="M100 0 V400 M200 0 V400 M300 0 V400 M400 0 V400 M500 0 V400 M600 0 V400 M700 0 V400"/>
